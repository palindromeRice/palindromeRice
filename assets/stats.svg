<svg xmlns="http://www.w3.org/2000/svg" width="840" height="130" viewBox="0 0 840 130" role="img" aria-label="Contribution stats for the last 12 months">
<style>
  text { font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif; fill: #3d3d3d; }
  .muted { fill: #9b8a76; } .title { font-size: 20px; } .lbl { font-size: 13px; } .val { font-size: 14px; }
  .big { font-size: 34px; fill: #043976; } .bar { fill: #043976; } .axis { stroke: #e2ddd6; }
  .grow-y { transform-box: fill-box; transform-origin: bottom; animation: gy .9s cubic-bezier(.2,.8,.2,1) both; }
  .grow-x { transform-box: fill-box; transform-origin: left; animation: gx .9s cubic-bezier(.2,.8,.2,1) both; }
  .rise { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
  .fade { animation: fade .6s ease-out both; }
  .cell { fill: #043976; } .empty { fill: #ebe7e1; }
  .l1 { opacity: .3; } .l2 { opacity: .55; } .l3 { opacity: .8; } .l4 { opacity: 1; }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop .4s ease-out both; }
  .area { fill: #043976; opacity: .12; } .line { fill: none; stroke: #043976; stroke-width: 2; }
  .draw { stroke-dasharray: 1; animation: draw 1.8s ease-out both; }
  .spoke { stroke: #043976; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 1; animation: draw .8s ease-out both; }
  .ring { stroke: #e2ddd6; fill: none; }
  @keyframes pop { from { opacity: 0; transform: scale(.3); } }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes gy { from { transform: scaleY(0); } }
  @keyframes gx { from { transform: scaleX(0); } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-color-scheme: dark) {
    text { fill: #e7e9ee; } .muted { fill: #b8a68f; } .axis { stroke: #30363d; }
    .bar, .big, .cell { fill: #8fb4e8; } .empty { fill: #1f242c; } .ring { stroke: #30363d; }
    .area { fill: #8fb4e8; } .line, .spoke { stroke: #8fb4e8; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style><text x="30" y="30" class="title">Last 12 months</text><g class="rise" style="animation-delay:0.00s"><text x="95.0" y="88" text-anchor="middle" class="big">1,065</text><text x="95.0" y="112" text-anchor="middle" class="lbl muted">contributions</text></g><g class="rise" style="animation-delay:0.12s"><text x="225.0" y="88" text-anchor="middle" class="big">220</text><text x="225.0" y="112" text-anchor="middle" class="lbl muted">commits</text></g><g class="rise" style="animation-delay:0.24s"><text x="355.0" y="88" text-anchor="middle" class="big">22</text><text x="355.0" y="112" text-anchor="middle" class="lbl muted">pull requests</text></g><g class="rise" style="animation-delay:0.36s"><text x="485.0" y="88" text-anchor="middle" class="big">51</text><text x="485.0" y="112" text-anchor="middle" class="lbl muted">repositories</text></g><g class="rise" style="animation-delay:0.48s"><text x="615.0" y="88" text-anchor="middle" class="big">3</text><text x="615.0" y="112" text-anchor="middle" class="lbl muted">day streak</text></g><g class="rise" style="animation-delay:0.60s"><text x="745.0" y="88" text-anchor="middle" class="big">7</text><text x="745.0" y="112" text-anchor="middle" class="lbl muted">longest streak</text></g></svg>
