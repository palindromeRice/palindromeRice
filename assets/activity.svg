 fade" style="animation-delay:0.36s">100</text><text x="452.5" y="218" text-anchor="middle" class="lbl muted">Jun</text><rect x="493.0" y="66.0" width="49.0" height="134.0" rx="2" class="bar grow-y" style="animation-delay:0.42s"/><text x="517.5" y="60.0" text-anchor="middle" class="lbl fade" style="animation-delay:0.42s">262</text><text x="517.5" y="218" text-anchor="middle" class="lbl muted">Jul</text><rect x="558.0" y="119.2" width="49.0" height="80.8" rx="2" class="bar grow-y" style="animation-delay:0.48s"/><text x="582.5" y="113.2" text-anchor="middle" class="lbl fade" style="animation-delay:0.48s">158</text><text x="582.5" y="218" text-anchor="middle" class="lbl muted">Aug</text><rect x="623.0" y="131.5" width="49.0" height="68.5" rx="2" class="bar grow-y" style="animation-delay:0.54s"/><text x="647.5" y="125.5" text-anchor="middle" class="lbl fade" style="animation-delay:0.54s">134</text><text x="647.5" y="218" text-anchor="middle" class="lbl muted">Sep</text><rect x="688.0" y="87.0" width="49.0" height="113.0" rx="2" class="bar grow-y" style="animation-delay:0.60s"/><text x="712.5" y="81.0" text-anchor="middle" class="lbl fade" style="animation-delay:0.60s">221</text><text x="712.5" y="218" text-anchor="middle" class="lbl muted">Oct</text><rect x="753.0" y="187.2" width="49.0" height="12.8" rx="2" class="bar grow-y" style="animation-delay:0.66s"/><text x="777.5" y="181.2" text-anchor="middle" class="lbl fade" style="animation-delay:0.66s">25</text><text x="777.5" y="218" text-anchor="middle" class="lbl muted">Nov</text></svg>
