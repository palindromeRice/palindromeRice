name: update charts

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [gen.py]

permissions:
  contents: write

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#043976&color_dots=#ebedf0,#c6d3e6,#8fa9cf,#4d70a8,#043976
            dist/snake-dark.svg?palette=github-dark&color_snake=#8fb4e8
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python gen.py
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - name: commit charts
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add assets README.md
          git diff --cached --quiet || { git commit -m "chore: update charts and stats" && git push; }
